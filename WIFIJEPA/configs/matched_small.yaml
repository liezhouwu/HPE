
experiment:
  dataset_root: dataset
  audit_root: WIFIJEPA/audit
  pretrain_root: WIFIJEPA/results/pretrain
  finetune_root: WIFIJEPA/result_metafi_ssl
  protocol: protocol1
  scope: strict
  split: random_split
  label_budget: 2shot

  seed: 42
  device: cuda
  num_workers: 0
  mode: supervised  # supervised ? jepa
  pretrain_checkpoint: null
  pretrain_manifest: null

# WiFi-JEPA MM-Fi 首轮配置
input:
  channels: 3
  subcarriers: 114
  time: 10
  links: 3
  amplitude_only: true
  use_existing_preprocess: true
  disable_normalization: false

model:
  embed_dim: 768
  depth: 6
  num_heads: 6
  ffn_dim: 3072
  predictor_depth: 2

mask:
  mode: link
  masked_links: 1
  # 后续消融改为 2；每次实验保持其余设置不变。

pretrain:
  sequence_fraction: 0.2
  epochs: 10
  batch_size: 32
  max_batches: null
  amp: true
  lr_min: 0.00001
  learning_rate: 0.00024
  weight_decay: 0.01
  ema_start: 0.996
  ema_end: 1.0
  loss: smooth_l1_latent

finetune:
  epochs: 25
  num_workers: 0
  val_every: 5
  optimizer: adamw
  learning_rate: 0.0003
  weight_decay: 0.0
  scheduler: cosine
  lr_min: 0.000001
  dropout_p: 0.0
  selection_metric: mpjpe
  early_stopping_patience: 10
  use_epoch_patience: false
  loss_name: mse
