experiment:
  dataset_root: ../my_dataset
  audit_root: WIFIJEPA/audit
  output_root: WIFIJEPA/RePos_Cross_Scene/runs_jepa_m2_init_fast
  protocol: protocol3
  scope: strict
  split: cross_scene_split
  label_budget: 4shot
  seed: 42
  device: cuda
  pretrain_checkpoint: WIFIJEPA/cross_sence/runs/pretrain_control/protocol3/cross_scene_split/seed42/u20-e10-m2-b05f800547/encoder.pth

input:
  subcarriers: 114
  time: 10
  links: 3
  disable_normalization: false

model:
  embed_dim: 768
  depth: 6
  num_heads: 6
  ffn_dim: 3072
  query_depth: 1
  dropout: 0.0
  n_angle: 90
  phase_mode: paper

finetune:
  batch_size: 16
  eval_batch_size: 32
  stage1_epochs: 2
  stage2_epochs: 10
  stage1_lr: 0.0001
  stage2_lr: 0.0003
  weight_decay: 0.0001
  limb_weight: 0.1
  root_weight: 1.0
  amp: true






