method: WAC-CSI-Memory

experiment:
  dataset_root: ../my_dataset
  manifest: result_metafi_ssl/runs/protocol3/strict/cross_scene_split/seed42/audit/b4s/data_manifest.json
  label_manifest: result_metafi_ssl/runs/protocol3/strict/cross_scene_split/seed42/audit/b4s/fewshot_manifest.json
  protocol: protocol3
  split: cross_scene_split
  scope: strict
  seed: 42
  label_budget: 4shot
  device: cuda
  epochs: 25
  batch_size: 64
  num_workers: 0
  learning_rate: 0.0003
  weight_decay: 0.0001
  min_learning_rate: 0.00001
  amp: true
  resume: true
  log_interval: 50
  max_train_batches: 0
  max_select_batches: 0
  max_test_batches: 0

model:
  dim: 128
  top_k: 8
  temperature: 0.12
  max_residual: 0.75

loss:
  cell_weight: 1.0
  residual_weight: 1.0
  pose_weight: 1.0
  relative_weight: 1.0
  bone_weight: 0.10
  retrieval_weight: 0.10

metrics:
  primary: [absolute_mpjpe, pa_mpjpe]

artifacts:
  output_root: MY_SOTA/WAC_CSI/results/protocol3/cross_scene_split/seed42/b4s_memory
  checkpoint: best_absolute.pth
  last_state: last_state.pth
  final_report: final_report.json
